<!-- ==============================================================================
     File: app/index.html
     Purpose: the single page of the ashr phone app: header, agent row, card stack, round decision
     buttons, guard log and the modal sheets.

     How it fits: served by hub/server.mjs at / (static files from app/). All behaviour is in app.js
     (ES module, no build step); this file holds only static structure plus the ids that scripts
     look up. Scripts: app.js (controller), api.js (network), card.js, sheets.js, swipe.js, fx.js,
     agents.js, character.js, faces.js, explain.js, haptics.js, voice.js, mock.js (demo).

     Pairing: the page is opened from the QR link /?pair=<code>; api.js exchanges the code for a token
     and cleans the address bar. Without a token the app shows a 'not paired' screen; ?demo=1 runs on
     built-in fake data.

     Accessibility: live regions (aria-live) announce connection status, the stack and toasts; icon
     buttons carry aria-labels; sheets are native <dialog>s (focus trap, Escape closes).
     ============================================================================== -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <!-- viewport-fit=cover lets the layout extend under the notch; styles.css then pads with
       env(safe-area-inset-*) so content stays clear of it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Colours the browser/status bar to match the app background (#050806 = --bg in styles.css). The two
       apple-* tags make 'Add to Home Screen' open the app full-screen on iOS with a translucent status bar. -->
  <meta name="theme-color" content="#050806" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ashr</title>
  <meta name="description" content="ashr - Mobile triage controller for coding agents" />

  <!-- PWA manifest and icon (both static files next to this page, served by hub/server.mjs). -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />

  <!-- Two stylesheets: styles.css is the whole app; ai-explain.css is only the 'Ask a model' bar inside
       cards (kept separate because it belongs to ai-explain-ui.js). -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="ai-explain.css" />
</head>
<body>
  <!-- Top bar: brand and live connection status (connecting / live / offline / demo mode). -->
  <header class="top">
    <div class="brand"><img src="icon.svg" alt="" width="26" height="26" /> ashr</div>
    <div id="conn" class="conn" data-state="connecting" role="status" aria-live="polite">connecting</div>
  </header>

  <!-- Row of agent tiles, filled in by app.js (renderHerd). -->
  <section id="herd" class="herd" aria-label="Your agents"></section>

  <!-- Main column: pending-approval count, the swipeable card stack, round buttons, then the guard log. -->
  <main>
    <section class="hero">
      <div><span id="count" class="count">0</span> <span id="count-word" class="count-word">need you</span></div>
      <div id="count-sub" class="muted small">all quiet</div>
    </section>

    <section id="stack" class="stack" aria-live="polite"></section>

    <!-- Round buttons act on the top card, as an alternative to swiping: deny, redirect, allow. -->
    <div id="decide" class="decide">
      <button id="btn-deny" class="round deny" aria-label="Deny">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-redo" class="round redo" aria-label="Tell it to do something else">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-allow" class="round allow" aria-label="Allow">
        <svg viewBox="0 0 24 24" aria-hidden="true" title="Allow"><path d="M12 2a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6zm0 4.2c-1 3.5-3.8 8.8-8 13.8 3.5 1.5 12.5 1.5 16 0-4.2-5-7-10.3-8-13.8zm0 4.5c.8 2.2 2.2 5.2 4.4 7.6-2.8.8-6 0-8.8 0 2.2-2.4 3.6-5.4 4.4-7.6z" fill="currentColor"/><path d="M7 21.5h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="hint" class="hint">swipe right to allow · left to deny · bubble to redirect</div>

    <h2 class="section-title">guard log</h2>
    <section id="log" class="log"></section>
  </main>

  <!-- Agent detail sheet: shows the agent's folder, lets you message it (typed or dictated) or stop it. Driven by sheets.js. -->
  <dialog id="sheet" class="sheet">
    <form method="dialog" class="sheet-inner chat" id="sheet-form">
      <div class="chat-head">
        <button value="close" class="icon-btn" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span id="sheet-agent" class="tile-holder"></span>
        <div class="chat-who"><strong id="sheet-title"></strong><div id="sheet-state" class="muted small"></div></div>
        <button type="button" id="kill" class="stop-btn">stop</button>
      </div>
      <div class="chat-body">
        <div class="bubble them">I'm in <span id="sheet-cwd" class="mono"></span>. What should I do next?</div>
      </div>
      <div class="composer">
        <textarea id="say-text" rows="1" maxlength="2000" placeholder="Send a message" aria-label="Message to agent"></textarea>
        <button type="button" id="mic" class="icon-btn" aria-label="Hold to talk">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" id="say-send" class="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 17-3-7-7-2z" fill="currentColor"/></svg>
        </button>
      </div>
    </form>
  </dialog>

  <!-- Deny sheet: pick quick reasons and/or type one; the text is sent back to the agent. -->
  <dialog id="deny-sheet" class="sheet">
    <form method="dialog" class="sheet-inner">
      <strong class="sheet-q">Why deny?</strong>
      <div class="chips" id="deny-chips">
        <button type="button" class="chip">not that file</button>
        <button type="button" class="chip">no network installs</button>
        <button type="button" class="chip">run the tests first</button>
        <button type="button" class="chip">ask me before pushing</button>
      </div>
      <textarea id="deny-text" rows="2" maxlength="500" placeholder="or say it in your words" aria-label="Denial reason"></textarea>
      <div class="row">
        <button type="button" id="deny-cancel" class="btn ghost">cancel</button>
        <button type="button" id="deny-send" class="btn deny">deny</button>
      </div>
    </form>
  </dialog>

  <!-- Redirect sheet: tell the agent what to do instead of the requested action. -->
  <dialog id="redo-sheet" class="sheet">
    <form method="dialog" class="sheet-inner">
      <strong class="sheet-q">Tell it what to do instead</strong>
      <p class="sheet-sub">The agent skips this step and follows your note.</p>
      <div class="chips" id="redo-chips">
        <button type="button" class="chip">show me your plan first</button>
        <button type="button" class="chip">find a safer way</button>
        <button type="button" class="chip">skip this and keep going</button>
      </div>
      <div class="composer">
        <textarea id="redo-text" rows="1" maxlength="500" placeholder="Say it in your words" aria-label="Redirect instructions"></textarea>
        <button type="button" id="redo-mic" class="icon-btn" aria-label="Hold to talk">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" id="redo-send" class="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 17-3-7-7-2z" fill="currentColor"/></svg>
        </button>
      </div>
      <button type="button" id="redo-cancel" class="btn ghost">cancel</button>
    </form>
  </dialog>

  <!-- Shows the full command or file change for the current ask. -->
  <dialog id="diff-sheet" class="sheet">
    <form method="dialog" class="sheet-inner">
      <strong class="sheet-q">The change</strong>
      <pre id="diff-pre" class="diff-pre"></pre>
      <button value="close" class="btn ghost">close</button>
    </form>
  </dialog>

  <!-- Transient status messages (see toast() in app.js). -->
  <div id="toast" class="toast" role="status"></div>

  <!-- All behaviour lives in ES modules loaded from app.js; there is no build step. -->
  <script type="module" src="app.js"></script>
</body>
</html>
