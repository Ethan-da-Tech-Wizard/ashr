<!DOCTYPE html>
<!--
  Program: ashr - stage.html
  Programmer: Ethan-da-Tech-Wizard (written with Claude, an AI assistant)
  Last Modified: 2026-11-18
  Purpose: The 1920 by 1080 stage page for the 60-second demo video: captions on the left, the real phone app (demo mode) in a phone frame on the right, driven by demo/record.py.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ashr: 60-second animation stage</title>
<!--
  The stage for the 60-second animation. 1920 x 1080.
  Left: one caption per scene. Right: the real phone app in demo mode.
  demo/record.py drives it: scene(n) changes the caption, spotAt(x, y, w, h, r) rings part of the phone,
  touch(x, y, down) moves the finger dot. Open it by hand at /demo/stage.html?preview=1 to
  step through the scenes with the arrow keys.
-->
<style>
  /* Colour variables for the stage. */
  :root { --bg:#050806; --ink:#ecfff1; --mute:#7f9787; --lime:#8cff32; --rust:#ff4d4d; --line:#1f2d24; }
  * { box-sizing:border-box; }
  /* The page is a fixed 1920 by 1080 canvas so recorded frames are always the same size. */
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:"Inter Tight","SF Pro Display",system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
  /* Background decoration: soft green glows and a faint grid. */
  .glow { position:absolute; inset:0; background:
    radial-gradient(60% 55% at 75% 50%, rgba(140,255,50,.16), transparent 70%),
    radial-gradient(50% 60% at 10% 100%, rgba(140,255,50,.07), transparent 70%); }
  .grid { position:absolute; inset:0; opacity:.5; background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:96px 96px; -webkit-mask-image:radial-gradient(70% 70% at 30% 50%, #000, transparent); mask-image:radial-gradient(70% 70% at 30% 50%, #000, transparent); }

  /* Logo and step label in the corners. */
  .brand { position:absolute; left:120px; top:84px; display:flex; align-items:center; gap:14px; font-size:30px; font-weight:800; letter-spacing:-.03em; }
  .brand img { width:44px; height:44px; border-radius:12px; }
  .step { position:absolute; left:122px; bottom:84px; font-size:17px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); font-weight:700; }

  /* Caption area: every scene has one caption block; only the one with class "on" is visible and it fades and slides in. */
  .caption { position:absolute; left:120px; top:0; bottom:0; width:940px; display:flex; flex-direction:column; justify-content:center; }
  .cap { position:absolute; left:0; right:0; opacity:0; transform:translateY(26px); transition:opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1); }
  .cap.on { opacity:1; transform:none; }
  .eyebrow { color:var(--lime); font-size:20px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; margin-bottom:22px; }
  .big { font-size:92px; line-height:.98; font-weight:800; letter-spacing:-.045em; margin:0; }
  .big em { font-style:normal; color:var(--lime); }
  .big em.red { color:var(--rust); }
  .sub { font-size:34px; line-height:1.3; color:var(--mute); margin:28px 0 0; max-width:820px; }

  /* The phone frame; the "off" class slides it down and hides it until it is shown. */
  .phone { position:absolute; left:1200px; top:54px; width:466px; height:972px; border-radius:66px; background:#000;
    box-shadow:0 0 0 2px #2a322c, 0 0 0 12px #0b0f0c, 0 0 0 14px #2a322c, 0 60px 120px -30px rgba(140,255,50,.35);
    transition:transform .9s cubic-bezier(.2,.8,.2,1), opacity .7s ease; }
  .phone.off { transform:translateY(90px) scale(.96); opacity:0; }
  .phone iframe { position:absolute; left:18px; top:20px; width:430px; height:932px; border:0; border-radius:48px; background:var(--bg); }
  /* A glowing ring that can be placed over any part of the phone to point at it. */
  .spot { position:absolute; z-index:8; border-radius:26px; box-shadow:0 0 0 3px var(--lime), 0 0 40px 6px rgba(140,255,50,.55); opacity:0; transition:all .5s cubic-bezier(.2,.8,.2,1); pointer-events:none; }
  .spot.on { opacity:1; }
  /* A round dot that acts as the finger; "down" makes it smaller and greener, "fast" turns off the gliding move while dragging. */
  .finger { position:absolute; left:0; top:0; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%; pointer-events:none; z-index:9;
    background:rgba(255,255,255,.28); box-shadow:0 0 0 2px rgba(255,255,255,.8), 0 6px 22px rgba(0,0,0,.5); opacity:0;
    transition:transform .45s cubic-bezier(.3,.7,.2,1), opacity .3s, width .15s, height .15s, margin .15s, background .15s; }
  .finger.on { opacity:1; }
  .finger.down { width:42px; height:42px; margin:-21px 0 0 -21px; background:rgba(140,255,50,.5); }
  .finger.fast { transition:opacity .3s, width .15s, height .15s, margin .15s, background .15s; }

  /* Full-screen title and end cards that fade in and out. */
  .cover { position:absolute; inset:0; display:grid; place-content:center; justify-items:center; text-align:center; background:var(--bg); opacity:0; pointer-events:none; transition:opacity .8s ease; z-index:20; }
  .cover.on { opacity:1; }
  .cover .glow { z-index:-1; background:radial-gradient(45% 50% at 50% 50%, rgba(140,255,50,.2), transparent 70%); }
  .cover img { width:150px; height:150px; border-radius:38px; box-shadow:0 0 90px rgba(140,255,50,.45); }
  .cover h1 { font-size:190px; line-height:1; letter-spacing:-.06em; margin:34px 0 0; font-weight:800; }
  .cover p { font-size:44px; color:var(--mute); margin:18px 0 0; }
  .cover small { display:block; margin-top:46px; font-size:22px; letter-spacing:.16em; text-transform:uppercase; color:var(--lime); font-weight:700; }

  /* The green progress bar along the bottom that fills over 60 seconds. */
  .bar { position:absolute; left:0; bottom:0; height:6px; width:100%; background:var(--lime); transform-origin:left; transform:scaleX(0); }
  .bar.run { transition:transform 60s linear; transform:scaleX(1); }
</style>
</head>
<body>
  <!-- Page content: background, logo, step label, caption holder, phone frame (an iframe that loads the app), ring and finger. -->
  <div class="glow"></div><div class="grid"></div>
  <div class="brand"><img src="../app/icon.svg" alt="" /> ashr</div>
  <div class="step" id="step"></div>

  <div class="caption" id="caption"></div>

  <div class="phone off" id="phone">
    <iframe id="app" title="ashr phone app" src="about:blank"></iframe>
  </div>
  <div class="spot" id="spot"></div>
  <div class="finger" id="finger"></div>

  <!-- The opening title card (visible at the start). -->
  <div class="cover on" id="cover-open">
    <div class="glow"></div>
    <img src="../app/icon.svg" alt="" />
    <h1>ashr</h1>
    <p>Keeps your coding agents in order.</p>
  </div>
  <!-- The closing card. -->
  <div class="cover" id="cover-end">
    <div class="glow"></div>
    <img src="../app/icon.svg" alt="" />
    <h1>ashr</h1>
    <p>Safe commands pass. Risky ones ask you first.</p>
    <small>SunHacks 2026 · Zazu + Ethan</small>
  </div>
  <!-- The progress bar element. -->
  <div class="bar" id="bar"></div>

<script>
  // The captions: one entry per scene with a step name, a small heading, a big headline and a sentence. Index 0 is blank for the opening.
  // One caption per scene. Keep each line short enough to read in three seconds.
  const SCENES = [
    { step: "", eyebrow: "", big: "", sub: "" },
    { step: "The problem", eyebrow: "You walked away", big: "Your agents<br>are <em>stuck</em>.", sub: "Each one stopped to ask permission. Nobody is at the laptop to answer." },
    { step: "The card", eyebrow: "On your phone", big: "Every request,<br>in <em>plain English</em>.", sub: "One sentence says what the command does. The exact command sits under it." },
    { step: "The card", eyebrow: "One tap", big: "Not sure?<br><em>Ask.</em>", sub: "See why it was flagged, how risky it is, and what a model makes of it." },
    { step: "Deny", eyebrow: "Swipe left", big: "<em class='red'>Deny</em> it,<br>and say why.", sub: "The agent stops and reads your note." },
    { step: "Allow", eyebrow: "Swipe right", big: "<em>Allow</em> it.<br>Done.", sub: "The agent carries on straight away." },
    { step: "Redirect", eyebrow: "Or neither", big: "Tell it what<br>to do <em>instead</em>.", sub: "Skip the step and send the agent a better plan." },
    { step: "Owners", eyebrow: "Two people, many agents", big: "See <em>who owns</em><br>every agent.", sub: "The character is the person. The colour is the agent." },
  ];
  // Shortcut for finding an element by id.
  const $ = (id) => document.getElementById(id);
  // Build the caption blocks from the list above.
  $("caption").innerHTML = SCENES.map((s, i) => `<div class="cap" data-i="${i}">
      <div class="eyebrow">${s.eyebrow}</div><h2 class="big">${s.big}</h2><p class="sub">${s.sub}</p></div>`).join("");

  // These window functions are called by record.py through Playwright. scene(i) shows caption i and sets the step label.
  window.scene = (i) => {
    document.querySelectorAll(".cap").forEach((c) => c.classList.toggle("on", Number(c.dataset.i) === i));
    $("step").textContent = SCENES[i]?.step || "";
  };
  // spotAt(x, y, w, h, r) moves the ring to a rectangle of the page; a width of 0 hides it.
  // Frames part of the phone with a green ring. Page pixels. A zero size hides it.
  window.spotAt = (x, y, w, h, r) => {
    const el = $("spot");
    if (!w) { el.classList.remove("on"); return; }
    Object.assign(el.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px`, borderRadius: `${r}px` });
    el.classList.add("on");
  };
  // touch(x, y, down, fast) moves the finger dot and sets its look.
  window.touch = (x, y, down = false, fast = false) => {
    const f = $("finger");
    f.classList.toggle("fast", fast);
    f.style.transform = `translate(${x}px, ${y}px)`;
    f.classList.add("on");
    f.classList.toggle("down", down);
  };
  // lift() hides the finger dot.
  window.lift = () => $("finger").classList.remove("on", "down");
  // Small helpers to load the app in demo mode, show the phone, toggle the title and end cards, and start the progress bar.
  window.loadApp = () => { $("app").src = "../app/?demo=1"; };
  window.showPhone = () => $("phone").classList.remove("off");
  window.openCover = (on) => $("cover-open").classList.toggle("on", on);
  window.endCover = (on) => $("cover-end").classList.toggle("on", on);
  window.startBar = () => $("bar").classList.add("run");

  // Preview mode (?preview=1): step through the scenes with the arrow keys instead of the recorder.
  // Hand preview: arrow keys step through the scenes.
  if (new URLSearchParams(location.search).get("preview")) {
    let i = 1;
    openCover(false); loadApp(); showPhone(); scene(i);
    addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") i = Math.min(SCENES.length - 1, i + 1);
      if (e.key === "ArrowLeft") i = Math.max(1, i - 1);
      scene(i);
    });
  }
</script>
</body>
</html>
